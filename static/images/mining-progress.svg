<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#627EEA"/>
      <stop offset="100%" style="stop-color:#3C3C3D"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#00cec9"/>
    </linearGradient>
  </defs>
  
  <!-- Rotating ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#e9ecef" stroke-width="8"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#glowGrad)" stroke-width="8" 
          stroke-dasharray="150 400" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" 
                      from="0 100 100" to="360 100 100" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ethereum Diamond -->
  <g transform="translate(100, 100)">
    <!-- Pulsing effect -->
    <g>
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.05;1" dur="1.5s" repeatCount="indefinite"/>
      <!-- Top half -->
      <polygon points="0,-45 30,0 0,15 -30,0" fill="url(#ethGrad)" opacity="0.9"/>
      <!-- Bottom half -->
      <polygon points="0,15 30,0 0,45 -30,0" fill="url(#ethGrad)" opacity="0.7"/>
      <!-- Highlight -->
      <polygon points="0,-45 0,45 -30,0" fill="#8c8c8c" opacity="0.3"/>
    </g>
  </g>
  
  <!-- Mining particles -->
  <g fill="url(#glowGrad)">
    <circle cx="50" cy="50" r="4" opacity="0.8">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;6;2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="60" r="3" opacity="0.6">
      <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="45" cy="140" r="3" opacity="0.7">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="r" values="2;5;2" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="155" cy="145" r="4" opacity="0.5">
      <animate attributeName="opacity" values="0;0.5;0" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="r" values="2;6;2" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>
</svg>
