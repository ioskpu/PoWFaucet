<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#627EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3C3C3D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cec9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Ethereum Diamond -->
  <g transform="translate(200, 100)">
    <!-- Top half -->
    <polygon points="0,-60 40,0 0,20 -40,0" fill="url(#ethGrad)" opacity="0.9"/>
    <!-- Bottom half -->
    <polygon points="0,20 40,0 0,60 -40,0" fill="url(#ethGrad)" opacity="0.7"/>
    <!-- Center line highlight -->
    <polygon points="0,-60 0,60 -40,0" fill="#8c8c8c" opacity="0.3"/>
  </g>
  
  <!-- Drops falling -->
  <g fill="url(#dropGrad)">
    <ellipse cx="160" cy="200" rx="8" ry="12" opacity="0.8">
      <animate attributeName="cy" values="180;220;180" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="210" rx="10" ry="15" opacity="0.9">
      <animate attributeName="cy" values="190;240;190" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="240" cy="195" rx="7" ry="10" opacity="0.7">
      <animate attributeName="cy" values="175;215;175" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Text -->
  <text x="200" y="270" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Testnet Faucet
  </text>
</svg>
