<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PoWFaucet</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/admin/admin.css">
    <style>
        /* Initial loading styles */
        .initial-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 500;
            margin: 0;
        }

        .loading-subtext {
            font-size: 14px;
            opacity: 0.8;
            margin: 8px 0 0 0;
        }

        /* Hide loading when React app loads */
        #admin-root:not(:empty) + .initial-loading {
            opacity: 0;
            pointer-events: none;
        }

        /* Ensure admin app takes full height */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #admin-root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="admin-root"></div>
    
    <!-- Fallback loading indicator -->
    <div class="initial-loading">
        <div class="loading-spinner"></div>
        <p class="loading-text">🔐 Cargando Admin Dashboard</p>
        <p class="loading-subtext">Inicializando componentes...</p>
    </div>

    <!-- Admin configuration -->
    <script>
        window.ADMIN_CONFIG = {
            apiPath: '/api/admin',
            refreshInterval: 5000,
            theme: 'dark',
            language: 'es',
            itemsPerPage: 20
        };
    </script>

    <!-- React and dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Admin app bundle -->
    <script src="/admin/admin.js"></script>
</body>
</html>
