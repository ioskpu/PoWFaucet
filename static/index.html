<!DOCTYPE html>
<html class="powfaucet">
  <head>
    <title>PoW Faucet</title>
    <!-- pow-faucet-header -->
    <meta charset='utf-8'>
    <link rel="Stylesheet" type="text/css" href="/css/powfaucet.css">
    <link href="/site.webmanifest" rel="manifest">
    <link href="/favicon/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="/favicon/favicon-32x32.png" rel="icon" sizes="32x32">
    <link href="/favicon/favicon-16x16.png" rel="icon" sizes="16x16">
    <style>
      /* Admin Access Button */
      .admin-access-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 9999;
        text-decoration: none;
        border: none;
      }
      
      .admin-access-button:hover {
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }
      
      .admin-access-button:active {
        transform: translateY(0) scale(0.98);
      }
      
      .admin-access-button svg {
        width: 28px;
        height: 28px;
        fill: white;
        animation: rotate 8s linear infinite;
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      .admin-access-button:hover svg {
        animation: rotate 2s linear infinite;
      }
      
      .admin-tooltip {
        position: absolute;
        right: 70px;
        background: rgba(0, 0, 0, 0.9);
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      
      .admin-access-button:hover .admin-tooltip {
        opacity: 1;
      }
      
      @media (max-width: 768px) {
        .admin-access-button {
          bottom: 15px;
          right: 15px;
          width: 48px;
          height: 48px;
        }
        
        .admin-access-button svg {
          width: 24px;
          height: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="faucet-wrapper">
      <div class="faucet-container faucet-bootstrap">
        <div class="pow-faucet" data-powfaucet="default">
          <div class="faucet-page">
            <div class="page-frontpage">
              <!-- pow-faucet-content -->
              <noscript>JavaScript is required to use this faucet.</noscript>
              <!-- pow-faucet-footer -->
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Admin Access Button -->
    <a href="/admin" class="admin-access-button" title="Admin Dashboard">
